                            if (sessions.length === 0) {
                                await createSession();
                            } else {
                                await switchSession(sessions[0].id);
                            }
                        } else {
                            authState.value = 'login';
                        }
                    } catch (e) {
                        authState.value = 'login';
                    }
                }

                async function doLogin() {
                    authError.value = '';
                    if (!loginForm.username || !loginForm.password) {
                        authError.value = '请输入用户名和密码';
                        return;
                    }
                    if (loginForm.otp_required && !loginForm.otp_code) {
                        authError.value = '请输入 OTP 验证码';
                        return;
                    }
                    authLoading.value = true;
                    try {
                        const url = loginForm.otp_required ? '/api/auth/login/otp' : '/api/auth/login';
                        const body = loginForm.otp_required
                            ? { username: loginForm.username, password: loginForm.password, otp_code: loginForm.otp_code }
                            : { username: loginForm.username, password: loginForm.password };
                        const resp = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify(body),
                        });
                        if (resp.ok) {
                            const data = await resp.json();
                            username.value = data.username || loginForm.username;
                            authState.value = 'app';
                            loginForm.username = '';
                            loginForm.password = '';
                            loginForm.otp_code = '';
                            loginForm.otp_required = false;
                            await loadConfig();
                            await loadSessions();
                            if (sessions.length === 0) {
                                await createSession();
                            } else {
                                await switchSession(sessions[0].id);
                            }
                        } else if (resp.status === 401) {
                            const data = await resp.json().catch(() => ({}));
                            if (data.error === 'otp_required') {
                                loginForm.otp_required = true;
                                authError.value = '该账号已绑定 OTP，请输入验证码';
                            } else {
                                authError.value = '用户名或密码错误';
                            }
                        } else {
                            authError.value = '登录失败，请重试';
                        }
                    } catch (e) {
                        authError.value = '网络错误，请重试';
                    } finally {
                        authLoading.value = false;
                    }
                }

                // 注册时勾选/取消 OTP：勾选时从后端获取密钥并生成二维码
                async function onToggleOTP() {
                    if (registerForm.enable_otp && !registerForm.otp_secret) {
                        try {
                            const resp = await fetch('/api/auth/otp-secret', { credentials: 'include' });
                            if (resp.ok) {
                                const data = await resp.json();
                                registerForm.otp_secret = data.secret;
                                // 生成 otpauth:// 二维码
                                nextTick(() => {
                                    if (otpQrcodeRef.value) {
                                        otpQrcodeRef.value.innerHTML = '';
                                        const label = encodeURIComponent('JXWAFAgent:' + registerForm.username);
                                        const uri = `otpauth://totp/${label}?secret=${data.secret}&issuer=JXWAFAgent&digits=6&period=30`;
                                        new QRCode(otpQrcodeRef.value, {
                                            text: uri,
                                            width: 180,
                                            height: 180,
                                            colorDark: '#000000',
                                            colorLight: '#ffffff',
                                            correctLevel: QRCode.CorrectLevel.M,
                                        });
                                    }
                                });
                            }
                        } catch (e) {}
                    } else if (!registerForm.enable_otp) {
                        registerForm.otp_secret = '';
                        registerForm.otp_code = '';
                        if (otpQrcodeRef.value) {
                            otpQrcodeRef.value.innerHTML = '';
                        }
                    }
                }

                async function doRegister() {
                    authError.value = '';
                    if (!registerForm.username || !registerForm.password) {
                        authError.value = '请输入用户名和密码';
                        return;
                    }
                    if (registerForm.password !== registerForm.confirm) {
                        authError.value = '两次密码不一致';
                        return;
                    }
                    if (registerForm.enable_otp && !registerForm.otp_code) {
                        authError.value = '请输入 OTP 验证码';
                        return;
                    }
                    authLoading.value = true;
                    try {
                        const body = { username: registerForm.username, password: registerForm.password };
                        if (registerForm.enable_otp) {
                            body.otp_secret = registerForm.otp_secret;
                            body.otp_code = registerForm.otp_code;
                        }
                        const resp = await fetch('/api/auth/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify(body),
                        });
                        if (resp.ok) {
                            const data = await resp.json();
                            username.value = data.username || registerForm.username;
                            authState.value = 'app';
                            registerForm.username = '';
                            registerForm.password = '';
                            registerForm.confirm = '';
                            registerForm.enable_otp = false;
                            registerForm.otp_secret = '';
                            registerForm.otp_code = '';
                            await loadConfig();
                            await loadSessions();
                            if (sessions.length === 0) {
                                await createSession();
                            } else {
                                await switchSession(sessions[0].id);
                            }
                        } else if (resp.status === 409) {
                            authError.value = '用户名已存在';
                        } else if (resp.status === 403) {
                            authError.value = '注册已关闭';
                        } else if (resp.status === 401) {
                            authError.value = 'OTP 验证码错误';
                        } else {
                            authError.value = '注册失败，请重试';
                        }
                    } catch (e) {
                        authError.value = '网络错误，请重试';
                    } finally {
                        authLoading.value = false;
                    }
                }

                async function logout() {
                    try {
                        await fetch('/api/auth/logout', {
                            method: 'POST',
                            credentials: 'include',
                        });
                    } catch (e) {}
                    authState.value = 'login';
                    sessions.splice(0, sessions.length);
                    messages.splice(0, messages.length);
                    currentSessionId.value = '';
                    username.value = '';
                }

                // === 会话管理 ===
                async function loadSessions() {
                    try {
                        const resp = await apiFetch('/api/sessions');
                        if (resp.ok) {
                            const data = await resp.json();
                            sessions.splice(0, sessions.length, ...(data.sessions || []));
                        }
                    } catch (e) {}
                }

                async function createSession() {
                    try {
                        const resp = await apiFetch('/api/sessions', { method: 'POST' });
                        if (resp.ok) {
                            const data = await resp.json();
                            sessions.unshift(data);
                            await switchSession(data.id);
                        }
                    } catch (e) {}
                }

                async function switchSession(id) {
                    // 不中断其他会话的流式输出
                    currentSessionId.value = id;
                    isStreaming.value = streamingMap.has(id);
                    messages.splice(0, messages.length);
                    nextTick(() => inputRef.value?.focus());
                    // 加载历史消息
                    try {
                        const resp = await apiFetch('/api/sessions/' + id);
                        if (resp.ok) {
                            const data = await resp.json();
                            loadHistoryMessages(data.messages || []);
                        }
                    } catch (e) {}
                    // 如果该会话正在流式输出，重新挂载 assistantMsg 到消息列表
                    if (streamingMap.has(id)) {
                        messages.push(streamingMap.get(id).assistantMsg);
                        forceScrollToBottom();
                    }
                }

                // 将后端 OpenAI 格式消息转换为前端展示格式
                // 一个用户请求的所有 assistant 消息（含多轮工具调用）合并为一个前端消息
                // 使用 segments 数组保留文本与工具调用的时序关系
                function loadHistoryMessages(rawMsgs) {
                    let msgId = msgIdCounter;
                    let currentAssistant = null;
                    for (const raw of rawMsgs) {
                        if (raw.role === 'user') {
                            currentAssistant = null;
                            messages.push({
                                id: ++msgId, role: 'user', content: raw.content || '',
                            });
                        } else if (raw.role === 'assistant') {
                            // 如果没有当前 assistant 消息，创建新的
                            if (!currentAssistant) {
                                currentAssistant = reactive({
                                    id: ++msgId, role: 'assistant',
                                    segments: [],
                                    reasoning: '', reasoningOpen: true, thinking: false,
                                    applying: false, interrupted: false, copiedField: '',
                                });
                                messages.push(currentAssistant);
                            }
                            // 有文本内容则追加文本 segment
                            if (raw.content) {
                                currentAssistant.segments.push({ type: 'text', content: raw.content });
                            }
                            // 解析 tool_calls，追加工具 segment
                            if (raw.tool_calls) {
                                for (const tc of raw.tool_calls) {
                                    currentAssistant.segments.push({
                                        type: 'tool',
                                        name: tc.function?.name || 'unknown',
                                        detail: '',
                                        status: 'done',
                                        open: false,
                                        call_id: tc.id,
                                    });
                                }
                            }
                        } else if (raw.role === 'tool') {
                            // 将 tool 结果附加到匹配的工具 segment
                            if (currentAssistant) {
                                const toolSeg = currentAssistant.segments.find(s => s.type === 'tool' && s.call_id === raw.tool_call_id);
                                if (toolSeg) {
                                    toolSeg.detail = raw.content || '';
                                    // 检查是否为 config_preview（generate_* 函数返回的 JSON）
                                    try {
                                        const cfg = JSON.parse(raw.content);
                                        if (cfg.config_json) {
                                            cfg.copiedField = '';
                                            currentAssistant.segments.push({ type: 'config', config: cfg });
                                        }
                                    } catch (e) {}
                                } else {
                                    // 无匹配的 tool_call_id，作为独立工具结果展示
                                    currentAssistant.segments.push({
                                        type: 'tool', name: '结果', detail: raw.content || '',
                                        status: 'done', open: false,
                                    });
                                }
                            }
                        }
                    }
                    msgIdCounter = msgId;
                    nextTick(() => forceScrollToBottom());
                }

                async function deleteSession(id) {
                    if (!confirm('确定删除此会话？')) return;
                    try {
                        const resp = await apiFetch('/api/sessions/' + id, { method: 'DELETE' });
                        if (resp.ok) {
                            const idx = sessions.findIndex(s => s.id === id);
                            if (idx >= 0) sessions.splice(idx, 1);
                            if (currentSessionId.value === id) {
                                if (sessions.length > 0) {
                                    await switchSession(sessions[0].id);
                                } else {
                                    await createSession();
                                }
                            }
                        }
                    } catch (e) {}
                }

                // === 聊天 ===
                async function send() {
                    const message = inputText.value.trim();
                    if (!message || isStreaming.value || !currentSessionId.value) return;

                    isStreaming.value = true;
                    inputText.value = '';
                    nextTick(() => autoResize());

                    const sessionId = currentSessionId.value;

                    messages.push({ id: ++msgIdCounter, role: 'user', content: message });

                    const assistantMsg = reactive({
                        id: ++msgIdCounter, role: 'assistant', segments: [], reasoning: '',
                        reasoningOpen: true, thinking: true,
                        applying: false, interrupted: false, copiedField: '',
                    });
                    messages.push(assistantMsg);
                    forceScrollToBottom();

                    const controller = new AbortController();
                    streamingMap.set(sessionId, { abortController: controller, assistantMsg });

                    try {
                        const resp = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ session_id: sessionId, message }),
                            signal: controller.signal,
                        });

                        if (resp.status === 401) {
                            authState.value = 'login';
                            return;
                        }

                        const reader = resp.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        const scrollIfCurrent = () => { if (currentSessionId.value === sessionId) scrollToBottom(); };

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (!line.startsWith('data: ')) continue;
                                const data = line.slice(6);
                                if (data === '{"type":"done"}') continue;
                                try {
                                    const evt = JSON.parse(data);
                                    if (evt.type === 'delta') {
                                        assistantMsg.thinking = false;
                                        const last = assistantMsg.segments[assistantMsg.segments.length - 1];
                                        if (last && last.type === 'text') {
                                            last.content += evt.data;
                                        } else {
                                            assistantMsg.segments.push({ type: 'text', content: evt.data });
                                        }
                                        scrollIfCurrent();
                                    } else if (evt.type === 'reasoning') {
                                        assistantMsg.reasoning += evt.data;
                                        scrollIfCurrent();
                                    } else if (evt.type === 'tool_start') {
                                        assistantMsg.segments.push({ type: 'tool', name: evt.data, detail: '', status: 'running', open: false });
                                        scrollIfCurrent();
                                    } else if (evt.type === 'tool_end') {
                                        const lastTool = [...assistantMsg.segments].reverse().find(s => s.type === 'tool' && s.status === 'running');
                                        if (lastTool) {
                                            lastTool.detail = evt.data;
                                            lastTool.status = 'done';
                                        } else {
                                            assistantMsg.segments.push({ type: 'tool', name: '结果', detail: evt.data, status: 'done', open: false });
                                        }
                                        scrollIfCurrent();
                                    } else if (evt.type === 'config_preview') {
                                        const lastTool = [...assistantMsg.segments].reverse().find(s => s.type === 'tool' && s.status === 'running');
                                        if (lastTool) lastTool.status = 'done';
                                        try {
                                            const cfg = JSON.parse(evt.data);
                                            cfg.copiedField = '';
                                            assistantMsg.segments.push({ type: 'config', config: cfg });
                                        } catch (e) {}
                                        scrollIfCurrent();
                                    } else if (evt.type === 'deployment_plan') {
                                        const lastTool = [...assistantMsg.segments].reverse().find(s => s.type === 'tool' && s.status === 'running');
                                        if (lastTool) lastTool.status = 'done';
                                        try {
                                            const plan = JSON.parse(evt.data);
                                            assistantMsg.segments.push({ type: 'deployment_plan', plan: plan });
                                        } catch (e) {}
                                        scrollIfCurrent();
                                    } else if (evt.type === 'deployment_summary') {
                                        const lastTool = [...assistantMsg.segments].reverse().find(s => s.type === 'tool' && s.status === 'running');
                                        if (lastTool) lastTool.status = 'done';
                                        try {
                                            const summary = JSON.parse(evt.data);
                                            assistantMsg.segments.push({ type: 'deployment_summary', summary: summary });
                                        } catch (e) {}
                                        scrollIfCurrent();
                                    } else if (evt.type === 'error') {
                                        assistantMsg.segments.push({ type: 'tool', name: '错误', detail: evt.data, status: 'error', open: true });
                                        scrollIfCurrent();
                                    }
                                } catch (e) {}
                            }
                        }
                        assistantMsg.thinking = false;
                        if (!assistantMsg.segments.length) {
                            assistantMsg.segments.push({ type: 'text', content: '(无响应)' });
                        }
                        loadSessions();
                    } catch (e) {
                        assistantMsg.thinking = false;
                        if (e.name === 'AbortError') {
                            assistantMsg.interrupted = true;
                        } else {
                            assistantMsg.segments.push({ type: 'text', content: '请求失败: ' + e.message });
                        }
                    } finally {
                        streamingMap.delete(sessionId);
                        if (currentSessionId.value === sessionId) {
                            isStreaming.value = false;
                        }
                    }
                }

                function stopStreaming() {
                    const sessionId = currentSessionId.value;
                    const entry = streamingMap.get(sessionId);
                    if (entry) {
                        entry.abortController.abort();
                        streamingMap.delete(sessionId);
                        isStreaming.value = false;
                    }
                }

                // === 配置管理 ===
                async function loadConfig() {
                    try {
                        const resp = await apiFetch('/api/config');
                        if (resp.ok) {
                            const data = await resp.json();
                            const cfg = data.config || {};
                            // 合并配置到表单
                            if (cfg.llm) {
                                configForm.llm.api_key = cfg.llm.api_key || '';
                                configForm.llm.base_url = cfg.llm.base_url || '';
                                configForm.llm.model = cfg.llm.model || '';
                                configForm.llm.thinking = cfg.llm.thinking || {};
                                configForm.llm.reasoning_effort = cfg.llm.reasoning_effort || 'max';
                                configForm.llm.max_tokens = cfg.llm.max_tokens || 65536;
                                configForm.llm.temperature = cfg.llm.temperature !== undefined ? cfg.llm.temperature : 1.0;
                                configForm.llm.do_sample = cfg.llm.do_sample || false;
                            }
                            if (cfg.cloud_env) {
                                configForm.cloud_env.enabled = cfg.cloud_env.enabled || false;
                                configForm.cloud_env.api_url = cfg.cloud_env.api_url || '';
                                configForm.cloud_env.waf_auth = cfg.cloud_env.waf_auth || '';
                                configForm.cloud_env.verify_url = cfg.cloud_env.verify_url || '';
                                configForm.cloud_env.auto_cleanup = cfg.cloud_env.auto_cleanup !== false;
                            }
                            if (cfg.agent) {
                                configForm.agent.max_iterations = cfg.agent.max_iterations || 30;
                            }
                        }
                    } catch (e) {}
                }

                async function saveConfig() {
                    configSaving.value = true;
                    configMessage.value = '';
                    try {
                        const resp = await apiFetch('/api/config', {
                            method: 'PUT',
                            body: JSON.stringify({ config: configForm }),
                        });
                        if (resp.ok) {
                            configMessage.value = '保存成功';
                            configMessageType.value = 'success';
                        } else {
                            const text = await resp.text();
                            configMessage.value = '保存失败: ' + text;
                            configMessageType.value = 'error';
                        }
                    } catch (e) {
                        configMessage.value = '网络错误: ' + e.message;
                        configMessageType.value = 'error';
                    } finally {
                        configSaving.value = false;
                        setTimeout(() => { configMessage.value = ''; }, 3000);
                    }
                }

                // === 主题 ===
                function applyTheme() {
                    let dark;
                    if (theme.value === 'auto') {
                        dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    } else {
                        dark = theme.value === 'dark';
                    }
                    document.documentElement.classList.toggle('dark', dark);
                    document.documentElement.classList.toggle('light', !dark);
                }

                function cycleTheme() {
                    const order = { light: 'dark', dark: 'auto', auto: 'light' };
                    theme.value = order[theme.value] || 'light';
                    localStorage.setItem('theme', theme.value);
                    applyTheme();
                }

                // === 菜单 ===
                function switchMenu(menu) {
                    activeMenu.value = menu;
                    if (menu === 'config') {
                        loadConfig();
                    }
                }

                // === 生命周期 ===
                let mediaQueryListener = null;

                onMounted(() => {
                    applyTheme();
                    // 监听系统主题变化（auto 模式）
                    const mq = window.matchMedia('(prefers-color-scheme: dark)');
                    mediaQueryListener = () => {
                        if (theme.value === 'auto') applyTheme();
                    };
                    if (mq.addEventListener) {
                        mq.addEventListener('change', mediaQueryListener);
                    } else if (mq.addListener) {
                        mq.addListener(mediaQueryListener);
                    }
                    checkAuth();
                    loadTemplates();
                });

                return {
                    // 认证
                    authState, username, loginForm, registerForm, authTab, authError, authLoading,
                    loginInputRef, otpQrcodeRef, doLogin, doRegister, logout, onToggleOTP,
                    // 菜单
                    activeMenu, switchMenu,
                    // 主题
                    theme, themeLabel, cycleTheme,
                    // 会话
                    sessions, currentSessionId, sessionSearch, filteredSessions, groupedSessions,
                    loadSessions, createSession, switchSession, deleteSession,
                    // 聊天
                    messages, inputText, isStreaming, chatContainer, inputRef,
                    send, stopStreaming, handleKey, autoResize, fillTemplate, forceScrollToBottom,
                    renderMarkdown, highlightCode, typeLabel, getAction, copyText, copyConfig,
                    // 配置
                    configForm, configSaving, configMessage, configMessageType,
                    thinkingEnabled, loadConfig, saveConfig,
                    // 模板
                    templates,
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
